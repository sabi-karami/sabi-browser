<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ورود به فایرفاکس سابی</title>
<style>
@font-face{font-family:Vazirmatn;src:url(/__sabi/vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,system-ui,sans-serif;color:#f3eefc;display:grid;place-items:center;padding:20px;
background:radial-gradient(900px 600px at 85% -10%,#ff7139aa,transparent 60%),radial-gradient(800px 700px at 0% 110%,#7542e5aa,transparent 60%),#15122b}
.card{width:min(420px,100%);padding:36px 30px 28px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
background:conic-gradient(from 210deg,#ff9500,#ff3750,#7542e5,#ff9500);box-shadow:0 10px 34px #ff375088}
.logo svg{width:42px;height:42px}
h1{font-size:25px;margin:0 0 6px;text-align:center;font-weight:800}
.sub{margin:0 0 26px;text-align:center;color:#c9c0e6;font-size:14px;line-height:1.9}
label{display:block;font-size:13px;color:#d9d2f0;margin-bottom:8px}
.field{position:relative}
input{width:100%;height:52px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:rgba(10,8,30,.55);color:#fff;
font:inherit;font-size:16px;padding:0 16px 0 52px;direction:ltr;text-align:left;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#ff9a57;box-shadow:0 0 0 4px #ff9a5733}
.eye{position:absolute;left:8px;top:8px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:#c9c0e6;cursor:pointer;font-size:18px}
.eye:hover{background:rgba(255,255,255,.1)}
button.go{margin-top:18px;width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-size:17px;font-weight:700;color:#fff;
background:linear-gradient(135deg,#ff7139,#ff3750 55%,#c4318f);box-shadow:0 10px 26px #ff375066;transition:transform .12s,filter .12s}
button.go:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.go:active{transform:none}
.err{margin:16px 0 0;padding:11px 14px;border-radius:12px;background:#ff375022;border:1px solid #ff375077;color:#ffd0d6;font-size:14px;text-align:center}
.foot{margin-top:22px;text-align:center;font-size:12.5px;color:#a79ec8;line-height:2}
.foot span{direction:ltr;unicode-bidi:embed}
</style>
</head>
<body>
<main class="card">
<div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
<h1>فایرفاکس سابی</h1>
<p class="sub">یک فایرفاکس کامل و به‌روز روی سرور آمریکا؛<br>برای ادامه رمز عبور را وارد کنید.</p>
<form method="post" action="/__sabi/login" autocomplete="off">
<label for="p">رمز عبور</label>
<div class="field">
<input id="p" name="password" type="password" required autofocus autocomplete="current-password" spellcheck="false" autocapitalize="off">
<button class="eye" type="button" aria-label="نمایش رمز" onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password'">&#128065;</button>
</div>
<!--ERR-->
<button class="go" type="submit">ورود</button>
</form>
<p class="foot">دسترسی خصوصی است و پروفایل (افزونه‌ها، بوکمارک‌ها و رمزها)<br>بین نشست‌ها ذخیره می‌ماند.</p>
</main>
</body>
</html>
