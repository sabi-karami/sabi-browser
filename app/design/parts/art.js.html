<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=document.documentElement;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const isWork=()=>{const w=$('workspace');return !!w&&!w.hidden};
let tt=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* accent */
const ACC=[['turquoise','فیروزه‌ای',188],['saffron','زعفرانی',78],['ruby','یاقوتی',12],['lapis','لاجوردی',262],['emerald','زمردی',152]];
const pop=$('accpop');
for(const [n,l,h] of ACC){const b=document.createElement('button');b.type='button';b.dataset.a=n;b.style.setProperty('--c',h);b.title=l;b.setAttribute('aria-label',l);b.setAttribute('aria-pressed','false');b.onclick=()=>{setAccent(n);};pop.appendChild(b)}
function setAccent(n,quiet){if(!ACC.some(a=>a[0]===n))n='turquoise';root.dataset.accent=n;store.set('sabi-accent',n);pop.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.a===n)));if(!quiet)toast('رنگ تأکید: '+ACC.find(a=>a[0]===n)[1])}
setAccent(store.get('sabi-accent','turquoise'),true);
const accBtn=$('accBtn');
function accToggle(f){const open=f===undefined?pop.hidden:f;pop.hidden=!open;accBtn.setAttribute('aria-expanded',String(open))}
accBtn.onclick=e=>{e.stopPropagation();accToggle()};
document.addEventListener('click',e=>{if(!pop.hidden&&!e.target.closest('.accent-wrap'))accToggle(false)});

/* clock + greeting (Jalali) */
function tick(){const d=new Date(),h=d.getHours();const g=h<5?'شب بخیر':h<12?'صبح بخیر':h<17?'روز بخیر':h<20?'عصر بخیر':'شب بخیر';
try{const date=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long'}).format(d);const time=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
$('greetW').textContent=g;$('greetD').textContent=date;$('clockTxt').textContent=time+' · '+date}catch{$('greetW').textContent=g}}
tick();setInterval(tick,20000);

/* ticker */
const words=['یک تب · چند دستگاه','لینک نشست','اسکن QR','حالت فقط‌تماشا','بدون نیاز به ورود','نشست ۱۲ دقیقه‌ای','تمدید ۵ دقیقه‌ای','IPv4 و IPv6','تم روشن و تیره','فرمان‌های سریع'];
const tr=$('track');if(tr){const h=words.map(w=>'<span>'+w+'</span>').join('');tr.innerHTML=h+h}

/* astrolabe */
function astro(){const el=$('astro');if(!el)return;const P=(r,a)=>[+(r*Math.cos(a)).toFixed(2),+(r*Math.sin(a)).toFixed(2)];
let ticks='';for(let i=0;i<120;i++){const a=i*Math.PI/60,big=i%10===0,mid=i%5===0;const[x1,y1]=P(big?131:mid?136:140,a),[x2,y2]=P(146,a);ticks+=`M${x1} ${y1}L${x2} ${y2}`}
let star='';for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,[x,y]=P(i%2?62:104,a);star+=(i?'L':'M')+x+' '+y}star+='Z';
let dots='';for(let i=0;i<24;i++){const[x,y]=P(80,i*Math.PI/12);dots+=`<circle cx="${x}" cy="${y}" r="${i%3?1.1:1.9}" class="a-f"/>`}
const shapes=[`<rect x="-10" y="-8" width="20" height="13" rx="2" class="a-dv"/><path d="M-5 9h10M0 5v4" class="a-dv"/>`,`<rect x="-6" y="-10" width="12" height="20" rx="3" class="a-dv"/><path d="M-1.8 7h3.6" class="a-dv"/>`,`<rect x="-9" y="-11" width="18" height="22" rx="3" class="a-dv"/><circle cy="7.2" r=".9" class="a-f"/>`];
let devs='';shapes.forEach((s,i)=>{const o=i*120,d=46;devs+=`<g><animateTransform attributeName="transform" type="rotate" from="${o}" to="${o+360}" dur="${d}s" repeatCount="indefinite"/><g transform="translate(0 -120)"><g><animateTransform attributeName="transform" type="rotate" from="${-o}" to="${-o-360}" dur="${d}s" repeatCount="indefinite"/><circle r="18" class="a-dev"/>${s}</g></g></g>`});
el.innerHTML=`<circle r="153" class="a-g" style="opacity:.35"/><circle r="150" class="a-g" style="opacity:.8"/>
<g class="a-g"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="240s" repeatCount="indefinite"/><path d="${ticks}"/></g>
<circle r="120" class="a-g" stroke-dasharray="1 5" style="opacity:.7"/>
<g class="a-a"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="110s" repeatCount="indefinite"/><path d="${star}" style="fill:color-mix(in srgb,var(--accent) 6%,transparent)"/><path d="${star}" transform="rotate(22.5)" style="opacity:.4"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="160s" repeatCount="indefinite"/>${dots}</g>
<circle r="44" class="a-g" stroke-dasharray="3 4" style="opacity:.8"/>
<circle r="34" class="a-a"><animate attributeName="r" values="34;46;34" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="4.5s" repeatCount="indefinite"/></circle>
<circle r="32" class="a-core"/><g class="a-g" style="stroke-width:1.6"><rect x="-15" y="-11" width="30" height="22" rx="4"/><path d="M-15 -4h30"/></g><circle cx="-10.5" cy="-7.6" r="1" class="a-f"/><circle cx="-6.5" cy="-7.6" r="1" class="a-f"/><circle cx="-2.5" cy="-7.6" r="1" class="a-f"/><path d="M-8 3h16M-8 7h9" class="a-a" stroke-linecap="round"/>${devs}`;
if(RM&&el.pauseAnimations)el.pauseAnimations()}
astro();

/* stars */
const cv=$('stars'),cx=cv.getContext('2d');let W=0,H=0,pts=[],mx=-999,my=-999,running=false,col={s:'255,236,200',l:'80,230,215'};
function readCols(){const cs=getComputedStyle(root);col.s=cs.getPropertyValue('--star').trim()||col.s;col.l=cs.getPropertyValue('--line').trim()||col.l}
function resize(){const dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(150,Math.round(W*H/11000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,r:Math.random()*1.4+.4,p:Math.random()*6.28}));readCols();draw(0,true)}
function draw(t,still){cx.clearRect(0,0,W,H);const near=[];for(const p of pts){if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;else if(p.x>W)p.x=0;if(p.y<0)p.y=H;else if(p.y>H)p.y=0}
const a=.3+.4*Math.sin(t/900+p.p);cx.fillStyle=`rgba(${col.s},${a.toFixed(3)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<170){near.push(p);cx.strokeStyle=`rgba(${col.l},${((1-d/170)*.55).toFixed(3)})`;cx.lineWidth=.8;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(mx,my);cx.stroke()}}
cx.lineWidth=.6;for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){const d=Math.hypot(near[i].x-near[j].x,near[i].y-near[j].y);if(d<120){cx.strokeStyle=`rgba(${col.l},${((1-d/120)*.3).toFixed(3)})`;cx.beginPath();cx.moveTo(near[i].x,near[i].y);cx.lineTo(near[j].x,near[j].y);cx.stroke()}}}
function loop(t){if(document.hidden||isWork()){running=false;return}draw(t);requestAnimationFrame(loop)}
function kick(){if(!running&&!RM&&!document.hidden&&!isWork()){running=true;requestAnimationFrame(loop)}}
resize();addEventListener('resize',()=>{resize();kick()});kick();
document.addEventListener('visibilitychange',kick);
const wsEl=$('workspace');if(wsEl)new MutationObserver(kick).observe(wsEl,{attributes:true,attributeFilter:['hidden']});
new MutationObserver(readCols).observe(root,{attributes:true,attributeFilter:['data-theme','data-accent']});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readCols);
let raf=0;const gl=$('glow');
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;gl.style.setProperty('--mx',mx+'px');gl.style.setProperty('--my',my+'px')});if(RM)return},{passive:true});
document.addEventListener('pointerleave',()=>{mx=my=-999});

/* recent sites */
const RK='sabi-recent';function getRecent(){try{const a=JSON.parse(store.get(RK,'[]'));return Array.isArray(a)?a.filter(x=>typeof x==='string').slice(0,5):[]}catch{return[]}}
function renderRecent(){const box=$('recent');if(!box)return;const a=getRecent();box.replaceChildren();box.hidden=!a.length;if(!a.length)return;
const l=document.createElement('span');l.className='rl';l.textContent='اخیراً:';box.appendChild(l);
for(const u of a){const b=document.createElement('button');b.type='button';b.textContent=u.length>34?u.slice(0,33)+'…':u;b.title=u;b.onclick=()=>{$('target').value=u;$('start').requestSubmit()};box.appendChild(b)}
const x=document.createElement('button');x.type='button';x.className='x';x.textContent='پاک‌کردن';x.onclick=()=>{store.set(RK,'[]');renderRecent();toast('فهرست اخیر پاک شد')};box.appendChild(x)}
$('start').addEventListener('submit',()=>{const v=$('target').value.trim().slice(0,200);if(!v)return;const a=getRecent().filter(x=>x!==v);a.unshift(v);store.set(RK,JSON.stringify(a.slice(0,5)));renderRecent()});
renderRecent();

/* tilt + spotlight */
if(matchMedia('(hover:hover)').matches&&!RM)for(const g of document.querySelectorAll('.gate')){g.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;g.style.setProperty('--px',x+'px');g.style.setProperty('--py',y+'px');g.style.setProperty('--ry',((x/r.width-.5)*7).toFixed(2)+'deg');g.style.setProperty('--rx',((.5-y/r.height)*7).toFixed(2)+'deg')});g.addEventListener('pointerleave',()=>{g.style.setProperty('--rx','0deg');g.style.setProperty('--ry','0deg')})}

/* reveal on scroll */
if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}},{threshold:.12});for(const el of document.querySelectorAll('#gates .sec-head,.gate-grid,.feat,#gates~section .sec-head')){el.classList.add('reveal');io.observe(el)}}

/* command palette */
const cm=$('cmdk'),ci=$('cmdq'),cl=$('cmdl');let vis=[],sel=0,last=null;
$('cmdKey').textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘K':'Ctrl K';
const openSite=u=>{$('target').value=u;$('start').requestSubmit()};
function build(q){const w=isWork(),L=[],add=(g,label,hint,glyph,run,kw)=>L.push({g,label,hint,glyph,run,kw:((kw||'')+' '+label+' '+hint).toLowerCase()});
const t=q.trim();
if(!w){if(t&&(/^https?:\/\/\S+$/i.test(t)||/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)))add('شروع','باز کردن «'+t+'»','Enter','↗',()=>openSite(t),t);
document.querySelectorAll('.quick button[data-u]').forEach(b=>add('شروع سریع',b.textContent.trim(),b.dataset.u,'↗',()=>openSite(b.dataset.u),b.dataset.u))}
else{const S=[['copy','کپی لینک همین تب','⧉'],['qrbtn','نمایش QR نشست','▦'],['eye','کپی لینک فقط‌تماشا','◉'],['extend','تمدید ۵ دقیقه‌ای نشست','＋'],['shot','ذخیرهٔ تصویر صفحه','◫'],['full','تمام‌صفحه','⛶'],['end','پایان نشست','■']];
for(const[id,l,g]of S){const b=$(id);if(b&&!b.hidden&&!b.disabled)add('نشست',l,'',g,()=>b.click(),'session نشست')}}
add('دروازه‌ها','صابی ابری','CLOUD','☁',()=>{location.href='/'},'cloud kitesurf');
add('دروازه‌ها','مرورگر مجازی','CHROMIUM','◴',()=>{location.href='https://sabi-virtual.nikanesalamat.ir/'},'virtual chromium chrome کروم');
add('دروازه‌ها','فایرفاکس','FIREFOX','◍',()=>{location.href='https://firefox.nikanesalamat.ir/'},'firefox');
add('ظاهر','تغییر تم (خودکار ← روشن ← تیره)','','◐',()=>$('theme').click(),'theme dark light تم تیره روشن');
for(const[n,l]of ACC)add('ظاهر','رنگ تأکید: '+l,'','●',()=>setAccent(n),'accent color رنگ');
add('راهنما','کد منبع در GitHub','↗','↗',()=>open('https://github.com/sabi-karami/sabi-browser','_blank','noopener'),'github source');
const toks=t.toLowerCase().split(/\s+/).filter(Boolean);return L.filter(x=>toks.every(k=>x.kw.includes(k)))}
function render(){const items=build(ci.value);vis=items;sel=Math.min(sel,Math.max(0,items.length-1));cl.replaceChildren();let g='';
if(!items.length){const li=document.createElement('li');li.className='hd';li.textContent='نتیجه‌ای پیدا نشد';cl.appendChild(li);return}
items.forEach((it,i)=>{if(it.g!==g){g=it.g;const h=document.createElement('li');h.className='hd';h.setAttribute('role','presentation');h.textContent=g;cl.appendChild(h)}
const li=document.createElement('li');li.id='cm'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',String(i===sel));const gl=document.createElement('span');gl.className='g';gl.textContent=it.glyph;const tx=document.createElement('span');tx.textContent=it.label;const sm=document.createElement('small');sm.textContent=it.hint;sm.dir='ltr';li.append(gl,tx,sm);li.onmousemove=()=>{if(sel!==i){sel=i;mark()}};li.onclick=()=>run(i);cl.appendChild(li)});mark()}
function mark(){cl.querySelectorAll('[role=option]').forEach((li,i)=>{const on=i===sel;li.setAttribute('aria-selected',String(on));if(on){li.scrollIntoView({block:'nearest'});ci.setAttribute('aria-activedescendant',li.id)}})}
function run(i){const it=vis[i];if(!it)return;closePal();it.run()}
function openPal(){last=document.activeElement;accToggle(false);cm.hidden=false;ci.value='';sel=0;render();ci.focus()}
function closePal(){if(cm.hidden)return;cm.hidden=true;if(last&&last.focus)try{last.focus()}catch{}}
$('cmdBtn').onclick=openPal;
ci.addEventListener('input',()=>{sel=0;render()});
cm.addEventListener('mousedown',e=>{if(e.target===cm)closePal()});
cm.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();sel=vis.length?(sel+1)%vis.length:0;mark()}else if(e.key==='ArrowUp'||(e.key==='Tab'&&e.shiftKey)){e.preventDefault();sel=vis.length?(sel-1+vis.length)%vis.length:0;mark()}else if(e.key==='Enter'){e.preventDefault();run(sel)}});
addEventListener('keydown',e=>{const t=e.target,field=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable,scr=t.id==='screen';
if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&e.code==='KeyK'){if(scr)return;e.preventDefault();cm.hidden?openPal():closePal()}
else if(e.code==='Slash'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!field&&!scr&&cm.hidden){e.preventDefault();openPal()}
else if(e.key==='Escape'){if(!cm.hidden){e.preventDefault();closePal()}else if(!pop.hidden){accToggle(false);accBtn.focus()}}},true);
})();
</script>
